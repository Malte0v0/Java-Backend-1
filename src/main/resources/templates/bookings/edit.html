<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit booking</title>
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>
<h1>Edit booking</h1>

<div th:if="${booking == null}">
    <form th:action="@{/bookings/edit/find}" method="get">
        <label>Booking ID</label>
        <label>
            <input type="number" name="id" required />
        </label>
        <button type="submit">Find</button>
    </form>
</div>

<div th:if="${booking != null}">
    <form th:action="@{/bookings/{id}/edit(id=${booking.id})}" method="post">
        <div>
            <label>Customer</label>
            <span th:text="${customerDisplay}"></span>
            <input type="hidden" name="customerId" th:value="${booking.customerId}" />
        </div>

        <div>
            <label>Room</label>
            <span th:text="${roomDisplay}"></span>
            <input type="hidden" name="roomId" th:value="${booking.roomId}" />
        </div>

        <div>
            <label>Check in</label>
            <label>
                <input type="date" name="checkInDate" th:value="${booking.checkInDate}" required />
            </label>
        </div>
        <div>
            <label>Check out</label>
            <label>
                <input type="date" name="checkOutDate" th:value="${booking.checkOutDate}" required />
            </label>
        </div>
        <div>
            <label>Guests</label>
            <label>
                <input type="number" name="numberOfGuests" th:value="${booking.numberOfGuests}" min="1" required />
            </label>
        </div>

        <button type="submit">Save</button>
        <a th:href="@{/bookings/list}">Cancel</a>
    </form>
</div>
</body>
</html>
