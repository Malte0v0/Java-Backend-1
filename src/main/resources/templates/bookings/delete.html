<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Delete booking</title></head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>
<h1>Delete Booking</h1>

<div th:if="${booking == null}">
    <form th:action="@{/bookings/delete/find}" method="get">
        <label>Booking ID</label>
        <label>
            <input type="number" name="id" required />
        </label>
        <button type="submit">Find</button>
    </form>
</div>

<div th:if="${booking != null}">
    <p>Are you sure you want to delete this booking?</p>
    <p>Customer: <strong th:text="${booking.customerFirstName} + ' ' + ${booking.customerLastName}"></strong></p>
    <p>Room: <strong th:text="${booking.roomType}"></strong></p>
    <p>Check in: <strong th:text="${booking.checkInDate}"></strong></p>
    <p>Check out: <strong th:text="${booking.checkOutDate}"></strong></p>

    <form th:action="@{/bookings/{id}/delete(id=${booking.id})}" method="post">
        <button type="submit">Confirm Delete</button>
        <a th:href="@{/bookings}">Cancel</a>
    </form>
</div>
</body>
</html>
