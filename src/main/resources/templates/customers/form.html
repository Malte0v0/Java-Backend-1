<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer skapa/edit</title>
</head>

<body>

<div th:replace="~{fragment/navbar :: navbar}"></div>

<h1>Customer form</h1>

<form

        th:action="${customer.id == null}
        ? @{/customers/save}
        : @{/customers/{id}/update(id=${customer.id})}"

        th:object="${customer}"

        method="post">


    <div>

        <label>First name</label>

        <input type="text" th:field="*{firstName}">

        <p
                th:if="${#fields.hasErrors('firstName')}"
                th:errors="*{firstName}">
        </p>

    </div>


    <div>

        <label>Last name</label>

        <input type="text" th:field="*{lastName}">

        <p
                th:if="${#fields.hasErrors('lastName')}"
                th:errors="*{lastName}">
        </p>

    </div>


    <div>

        <label>Email</label>

        <input type="email" th:field="*{email}">

        <p
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}">
        </p>

    </div>


    <div>

        <label>Phone</label>

        <input type="text" th:field="*{phone}">

        <p
                th:if="${#fields.hasErrors('phone')}"
                th:errors="*{phone}">
        </p>

    </div>


    <button type="submit">
        Save
    </button>


    <a th:href="@{/customers}">
        Cancel
    </a>

</form>

</body>
</html>
