<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>customers</title>
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>

<h1>customers</h1>
<a th:href="@{/customers/new}"> add customer</a>

<p th:href="${customers.isEmpty()}">no customer found.</p>


<table th:if=""${!customers.isEmpty()}>
    <thead>
    <tr>
        <th>name</th>
        <th>Email</th>
        <th>phone</th>

    </tr>
    </thead>






<tbody>
<tr th:each="customer : ${customer}">
    <td th:text = "${customer.name}"> namn</td>
    <td th:text="${customer.email}">Email</td>
    <td th:text="${customer.phone}">Phone</td>  
    
    
    <td>
        <!--
                Blir
                /customers/3/edit
           -->
        <a href="@{customers/{id}/edit(id=${customer.id})}"></a>



        <form th:action="@{/customers/{id}/delete(id=${customer.id})}"
              method="post"
              style="">
            <button type="submit">delete</button>
        </form>
    </td>
</tr>

</tbody>
</table>



</body>
</html>
