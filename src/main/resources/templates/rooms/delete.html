<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete room</title>
</head>
<body>

<h1>Delete room</h1>
<p>Are you sure you want to delete this room?</p>
<p>
    <strong th:text="${room.roomId}">room id </strong>
    <strong th:text="${room.roomType}">type</strong>
</p>
<form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post" style="">
    <button type="submit">Delete</button>
    <a th:href="@{/customers}">Cancel</a>
</form>
</body>
</html>
