<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete room</title>
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>
<h1>Delete room</h1>
<p>Are you sure you want to delete this room?</p>
<p>
    <strong th:text="${room.roomId}">room id </strong>
    <span th:text="${room.roomType}"> type</span>
    <strong>Extra beds:</strong>

    <span th:text="${room.extraBeds}">beds</span>

</p>
<form th:action="@{/rooms/{id}/delete(id=${room.roomId})}" method="post" style="">
    <button type="submit">Delete</button>
    <a th:href="@{/rooms/list}">Cancel</a>
</form>
</body>
</html>
