<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit room</title>
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>
<h1>Edit room</h1>
<form th:action="@{/rooms/{id}/edit(id=${room.roomId})}" th:object="${room}" method="post">
    <label>Room type</label>

    <select th:field="*{roomType}">

        <option th:each="type : ${roomTypes}"
                th:value="${type}"
                th:text="${type}"></option>

    </select>
    <div>
        <label>extra beds</label>
        <input type="number" th:field="*{extraBeds}">
    </div>
    <div>

    <button type="submit">update</button>
    <a th:href="@{/rooms/list}">Cancel</a>
</form>
</body>
</html>
