<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create room</title>
</head>
<body>
<div th:replace="~{fragment/navbar :: navbar}"></div>
<h1>Create room</h1>
<div th:if="${error}" style="color: red;">
    <p th:text="${error}"></p>
</div>
<form th:action="@{/rooms/new}" th:object="${room}" method="post">
    <label>Room type</label>

    <label>
        <select th:field="*{roomType}" id="roomType">
            <option th:each="type : ${roomTypes}"
                    th:value="${type}"
                    th:text="${type}">
            </option>
        </select>
    </label>
    <div>
        <label>Extra beds</label>
        <label>
            <input type="number" th:field="*{extraBeds}" min="0" max="2">
        </label>
    </div>

    <button type="submit">Save</button>

    <a th:href="@{/rooms/list}">Cancel</a>
</form>

</body>
</html>
